name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race -count=1

  fuzz:
    name: Fuzz parsers (bounded)
    runs-on: ubuntu-latest
    # Fuzz is slow; only run on pushes to main (and tag pushes), not
    # every PR. PRs still get the regular -race test pass via the
    # `test` job above, which exercises the seed corpus deterministically.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Minisign parser fuzz (30s)
        # A real finding writes the failing input under
        # internal/release/testdata/fuzz/ (Go does this for panics AND
        # assertion failures), so that dir is the authoritative crash
        # signal. The fuzz engine can SEPARATELY exit non-zero with a bare
        # "context deadline exceeded" when -fuzztime elapses mid-work on a
        # slow/loaded runner — a timing artifact, not a finding (the same
        # corpus passes locally at 6M+ execs). Fail on any crasher or other
        # error; tolerate ONLY the deadline race.
        run: |
          set +e
          out="$(go test -run='^$' -fuzz=FuzzParseMinisig -fuzztime=30s ./internal/release 2>&1)"
          rc=$?
          echo "$out"
          crashers="internal/release/testdata/fuzz/FuzzParseMinisig"
          if [ -d "$crashers" ] && [ -n "$(ls -A "$crashers" 2>/dev/null)" ]; then
            echo "::error::minisign fuzz found a crasher (input under $crashers)"; exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "minisign fuzz clean"; exit 0
          fi
          if echo "$out" | grep -q "context deadline exceeded"; then
            echo "::notice::minisign fuzz hit the -fuzztime deadline race with no crasher — tolerated"; exit 0
          fi
          echo "::error::minisign fuzz failed with a non-deadline error"; exit 1

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      # Gate on high-severity, high-confidence findings only. The
      # excluded rules are audited false-positives for this codebase
      # (see docs/security-scan-2026-06-01.md): G115 is mechanical
      # MEDIUM-confidence integer-conversion noise (all bounds-checked
      # before allocation), and G702/G703 are gosec's experimental taint
      # rules (local-only sources, argv-form exec). The TLS G402/G123
      # findings stay in scope and are individually #nosec-justified, so a
      # NEW high-severity finding still fails this gate.
      - name: gosec
        run: gosec -severity high -confidence high -exclude G702,G703,G115 ./...

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build .#mtroamd
        run: |
          nix build .#mtroamd --print-build-logs
          ./result/bin/mtroamd version

  build:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - linux-armv7
          - darwin-amd64
          - darwin-arm64
          - freebsd-amd64
          - freebsd-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.target }}
        run: make dist-${{ matrix.target }}

      - name: Show binary size
        run: ls -la dist/
