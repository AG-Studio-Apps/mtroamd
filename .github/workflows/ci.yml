name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not redundant coverage. The sidecar seeds a shell startup
        # file that is sourced into every user's real interactive shell, and
        # macOS is the only place we can exercise the shells users actually
        # have there: Apple ships BASH 3.2 (frozen at the last GPLv2 release,
        # a decade behind the bash on any Linux CI box) plus its own zsh
        # build. A modern parameter-expansion assumption in that startup line
        # would pass every Linux leg and break on a Mac.
        #
        # It is also the only environment where the shell-startup tests can
        # observe macOS PATH composition: the daemon runs as a LaunchAgent
        # with launchd's minimal PATH, and a NON-login shell never runs
        # /usr/libexec/path_helper (invoked from /etc/zprofile, a login file),
        # so /usr/local/bin and every /etc/paths.d entry can be absent.
        #
        # macos-install-smoke.yml is NOT a substitute: it is workflow_dispatch
        # only and self-describes as "NOT a recurring guard".
        os: [ubuntu-latest, macos-26]
    env:
      # ★★ macOS caps a UNIX socket path (sun_path) at 104 bytes, vs 108 on
      # Linux, and the runner's default TMPDIR is
      # /var/folders/df/<20 chars>/T/. A `t.TempDir()` under that plus a test
      # name plus "/001/mtroamd.sock" reaches 116 bytes, so every test that
      # binds or dials a socket failed with a bare "bind: invalid argument"
      # that names no limit. Measured from the first macOS run: 116 vs 104,
      # and 72 under /tmp.
      #
      # These are PRE-EXISTING assumptions in the tests (short temp paths),
      # surfaced rather than caused by adding this leg - the daemon's own
      # socket paths are chosen by the installer, not by TMPDIR. Setting a
      # short TMPDIR for the job fixes every one of them without touching the
      # tests; a per-test darwin special case would be the same fix repeated
      # nine times.
      # Set for both legs: /tmp is already the default on the Linux runner.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race -count=1

      # Diagnostic, not an assertion. The shell-startup tests SKIP a shell that
      # is absent, so this records what the leg actually covered - a silent skip
      # on a missing zsh would otherwise read as a pass.
      - name: Shell inventory
        if: always()
        run: |
          echo "bash: $(bash --version 2>/dev/null | head -1 || echo absent)"
          echo "zsh:  $(zsh --version 2>/dev/null || echo absent)"

      # Re-run the shell-startup tests VERBOSELY so each shell's result is
      # visible per OS. `go test` prints nothing for a passing package, so
      # without this the macOS coverage this leg exists for is only inferable
      # from the absence of a failure - and a skipped zsh is invisible.
      - name: Shell-startup coverage (explicit)
        if: always()
        run: go test ./internal/ptysidecar/ -run TestSeededShell -count=1 -v

  fuzz:
    name: Fuzz parsers (bounded)
    runs-on: ubuntu-latest
    # Fuzz is slow; only run on pushes to main, not every PR. PRs still get
    # the regular -race test pass via the `test` job above, which exercises
    # the seed corpus deterministically.
    #
    # ★ Pinned to main explicitly when `develop` joined the push trigger.
    # `github.event_name == 'push'` alone would have started running this on
    # every develop push, quietly multiplying the slowest job in the file.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Minisign parser fuzz (30s)
        # A real finding writes the failing input under
        # internal/release/testdata/fuzz/ (Go does this for panics AND
        # assertion failures), so that dir is the authoritative crash
        # signal. The fuzz engine can SEPARATELY exit non-zero with a bare
        # "context deadline exceeded" when -fuzztime elapses mid-work on a
        # slow/loaded runner — a timing artifact, not a finding (the same
        # corpus passes locally at 6M+ execs). Fail on any crasher or other
        # error; tolerate ONLY the deadline race.
        run: |
          set +e
          out="$(go test -run='^$' -fuzz=FuzzParseMinisig -fuzztime=30s ./internal/release 2>&1)"
          rc=$?
          echo "$out"
          crashers="internal/release/testdata/fuzz/FuzzParseMinisig"
          if [ -d "$crashers" ] && [ -n "$(ls -A "$crashers" 2>/dev/null)" ]; then
            echo "::error::minisign fuzz found a crasher (input under $crashers)"; exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "minisign fuzz clean"; exit 0
          fi
          if echo "$out" | grep -q "context deadline exceeded"; then
            echo "::notice::minisign fuzz hit the -fuzztime deadline race with no crasher — tolerated"; exit 0
          fi
          echo "::error::minisign fuzz failed with a non-deadline error"; exit 1

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      # Gate on high-severity, high-confidence findings only. The
      # excluded rules are audited false-positives for this codebase
      # (see docs/security-scan-2026-06-01.md): G115 is mechanical
      # MEDIUM-confidence integer-conversion noise (all bounds-checked
      # before allocation), and G702/G703 are gosec's experimental taint
      # rules (local-only sources, argv-form exec). The TLS G402/G123
      # findings stay in scope and are individually #nosec-justified, so a
      # NEW high-severity finding still fails this gate.
      - name: gosec
        run: gosec -severity high -confidence high -exclude G702,G703,G115 ./...

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build .#mtroamd
        run: |
          nix build .#mtroamd --print-build-logs
          ./result/bin/mtroamd version

  build:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - linux-armv7
          - darwin-amd64
          - darwin-arm64
          - freebsd-amd64
          - freebsd-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.target }}
        run: make dist-${{ matrix.target }}

      - name: Show binary size
        run: ls -la dist/
