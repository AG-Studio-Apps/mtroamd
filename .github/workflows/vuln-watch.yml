# Daily reachability-aware vulnerability sweep. govulncheck fails only
# when code in this repo actually CALLS a vulnerable symbol (unlike
# dependency-level alerts), which is exactly how GO-2026-5039/5037
# surfaced on 2026-06-03. Runs against both lines: main (released) and
# develop (in-flight), so a vuln introduced on develop is caught before
# it rides into a release.
#
# Dispatch-only by design: the daily 05:00 UTC triage routine
# (claude.ai/code/routines, govulncheck-triage) dispatches this workflow,
# watches it, and triages the result — it prepares the toolchain/dependency
# bump PR on failure and alerts James. This job is detection only.
#
# A `schedule:` cron was removed 2026-06-05: GitHub's scheduler never
# delivered a single schedule event in two days of trying (a known
# silent-failure mode for new cron workflows), so the routine is the
# scheduler of record. Do not re-add a cron without also rethinking the
# routine's STEP 0, or some days will get two runs and others one.
#
# Note: the matrix checks out each ref explicitly, so dispatching from
# main still scans both lines.

name: vuln-watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, develop]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
