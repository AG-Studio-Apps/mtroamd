name: Prune old releases

# Bounds the binary back-history. Keeps:
#   - the KEEP_STABLE newest stable releases  (users can roll back one),
#   - the KEEP_PRERELEASE newest -rc/dev prereleases,
#   - the release the iOS app currently pins  (force-keep, even if older —
#     the installer downloads exactly that tag, so deleting it breaks installs).
# Everything else is deleted: the GitHub Release + its tag + assets, and the
# matching .rpm on the gh-pages dnf repo. (apt is reprepro-managed — it already
# serves only the latest per suite and `deleteunreferenced` cleans the pool, so
# there's no multi-version back-history to prune there.)
#
# Triggers:
#   - workflow_run after every successful Release (real prune), and
#   - workflow_dispatch (manual) — DRY-RUN by default, so you can verify the
#     keep/delete list before anything is removed.
#
# Fail-safe: if the iOS pin can't be resolved, the job refuses to delete and
# exits cleanly rather than risk pruning the pinned release.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be pruned without deleting"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prune-releases
  cancel-in-progress: false

env:
  KEEP_STABLE: "2"
  KEEP_PRERELEASE: "2"
  IOS_REPO: AG-Studio-Apps/meshTerm
  IOS_PIN_PATH: Sources/meshTerm/MTRoam/MTRoamInstallConstants.swift

jobs:
  prune:
    # Only run on a successful Release (or any manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Auto (post-Release) runs are always real; manual runs honour dry_run (default true).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full tag history

      - name: Compute keep-list
        env:
          # Fine-grained PAT with read-only Contents access to the iOS repo,
          # used ONLY for the cross-repo pin read below. Falls back to the
          # default GITHUB_TOKEN (which can't read the other repo) when unset,
          # so an absent secret degrades to the fail-safe rather than failing.
          IOS_PIN_TOKEN: ${{ secrets.IOS_PIN_TOKEN }}
        run: |
          set -euo pipefail

          # --- iOS-pinned tag (force-keep). Read via IOS_PIN_TOKEN (a
          # fine-grained PAT with read-only Contents on the iOS repo); the
          # default GITHUB_TOKEN is repo-scoped and can't read it. If we
          # CAN'T resolve it, we abort all deletions — never risk pruning
          # whatever the app installs.
          PIN="$(GH_TOKEN="${IOS_PIN_TOKEN:-$GH_TOKEN}" gh api "repos/${IOS_REPO}/contents/${IOS_PIN_PATH}" --jq '.content' 2>/dev/null \
                  | base64 -d 2>/dev/null \
                  | grep -oE 'pinnedReleaseTag[^"]*"v[0-9][^"]*"' \
                  | grep -oE 'v[0-9][^"]*' | head -1 || true)"
          if [ -z "${PIN:-}" ]; then
            echo "::warning::could not resolve iOS pinnedReleaseTag from ${IOS_REPO}/${IOS_PIN_PATH} — ABORTING deletions (fail-safe)"
            echo "ABORT=1" >> "$GITHUB_ENV"
            : > /tmp/keep.txt
            exit 0
          fi
          echo "iOS pin: ${PIN}"

          # --- All tags, newest-first by semver.
          mapfile -t ALL < <(git tag -l 'v*' | sort -rV)

          KEEP=()
          # last KEEP_STABLE stable tags (no '-')
          n=0; for t in "${ALL[@]}"; do
            case "$t" in *-*) continue;; esac
            KEEP+=("$t"); n=$((n+1)); [ "$n" -ge "${KEEP_STABLE}" ] && break
          done
          # last KEEP_PRERELEASE prerelease tags (has '-')
          n=0; for t in "${ALL[@]}"; do
            case "$t" in *-*) ;; *) continue;; esac
            KEEP+=("$t"); n=$((n+1)); [ "$n" -ge "${KEEP_PRERELEASE}" ] && break
          done
          # force-keep the iOS pin
          KEEP+=("$PIN")

          mapfile -t KEEP < <(printf '%s\n' "${KEEP[@]}" | sort -uV)
          printf '%s\n' "${KEEP[@]}" > /tmp/keep.txt
          echo "KEEP (${#KEEP[@]}): ${KEEP[*]}"
          echo "## Prune keep-list" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${KEEP[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune GitHub Releases + tags
        run: |
          set -euo pipefail
          if [ "${ABORT:-0}" = "1" ]; then echo "fail-safe: skipping"; exit 0; fi
          echo "DRY_RUN=${DRY_RUN}"
          for t in $(git tag -l 'v*'); do
            grep -qxF "$t" /tmp/keep.txt && continue
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete release+tag $t"
            else
              echo "deleting release+tag $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            fi
          done

      - name: Prune gh-pages dnf rpms + reindex
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ "${ABORT:-0}" = "1" ]; then echo "fail-safe: skipping"; exit 0; fi
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages not seeded — nothing to prune"; exit 0
          fi
          sudo apt-get update && sudo apt-get install -y createrepo-c

          # Tag -> rpm version: strip leading 'v', '-' becomes '~' (nfpm semver schema).
          # Stable keep-tags map to rpm/stable; prerelease keep-tags map to rpm/dev.
          keep_versions () { # $1 = "stable" | "dev"
            while read -r t; do
              case "$1:$t" in
                stable:*-*) continue;;          # prerelease tag — not a stable-channel pkg
                dev:*-*) ;;                      # prerelease tag — dev channel
                dev:*) continue;;                # stable tag — not a dev-channel pkg
              esac
              printf '%s\n' "${t#v}" | tr '-' '~'
            done < /tmp/keep.txt
          }

          git fetch --no-tags origin gh-pages
          git worktree add --checkout rpmrepo origin/gh-pages
          changed=0
          for ch in stable dev; do
            mapfile -t KV < <(keep_versions "$ch")
            for f in rpmrepo/rpm/"$ch"/*/*.rpm; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"            # mtroamd-1.4.7-1.x86_64.rpm
              keep=0
              for v in "${KV[@]}"; do
                case "$base" in "mtroamd-${v}-"*) keep=1; break;; esac
              done
              if [ "$keep" -eq 0 ]; then
                if [ "${DRY_RUN}" = "true" ]; then echo "[dry-run] would rm $f";
                else echo "rm $f"; rm -f "$f"; changed=1; fi
              fi
            done
          done
          if [ "${DRY_RUN}" = "true" ] || [ "$changed" -eq 0 ]; then
            echo "no rpm changes to commit"; exit 0
          fi
          for d in rpmrepo/rpm/*/*/; do [ -d "$d" ] && createrepo_c "$d"; done
          cd rpmrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "prune: drop rpms outside keep-list" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:gh-pages
