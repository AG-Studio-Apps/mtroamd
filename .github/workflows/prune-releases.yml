name: Prune old releases

# Bounds the binary back-history. Keeps:
#   - the KEEP_STABLE newest stable releases  (users can roll back one),
#   - the KEEP_PRERELEASE newest -rc/dev prereleases,
#   - the release the iOS app currently pins  (force-keep, even if older —
#     the installer downloads exactly that tag, so deleting it breaks installs).
# Everything else is deleted: the GitHub Release + its tag + assets, and the
# matching .rpm on the gh-pages dnf repo. (apt is reprepro-managed — it already
# serves only the latest per suite and `deleteunreferenced` cleans the pool, so
# there's no multi-version back-history to prune there.)
#
# Triggers:
#   - workflow_run after every successful Release (real prune), and
#   - workflow_dispatch (manual) — DRY-RUN by default, so you can verify the
#     keep/delete list before anything is removed.
#
# Fail-safe: if the iOS pin can't be resolved, the job refuses to delete and
# exits cleanly rather than risk pruning the pinned release.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be pruned without deleting"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prune-releases
  cancel-in-progress: false

env:
  KEEP_STABLE: "2"
  KEEP_PRERELEASE: "2"
  IOS_REPO: AG-Studio-Apps/meshTerm
  IOS_PIN_PATH: Sources/meshTerm/MTRoam/MTRoamInstallConstants.swift
  # The active mtroamd pin lives on the iOS repo's develop branch (TestFlight
  # line). The App Store/main branch predates mtroamd, so its default branch
  # doesn't carry this constant — read develop explicitly.
  IOS_PIN_REF: develop

jobs:
  prune:
    # Only run on a successful Release (or any manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Auto (post-Release) runs are always real; manual runs honour dry_run (default true).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full tag history

      - name: Plan prune (resolve pin + channels + per-channel keep-lists)
        env:
          # Fine-grained PAT with read-only Contents access to the iOS repo,
          # used ONLY for the cross-repo pin read below. Falls back to the
          # default GITHUB_TOKEN (which can't read the other repo) when unset,
          # so an absent secret degrades to the fail-safe rather than failing.
          IOS_PIN_TOKEN: ${{ secrets.IOS_PIN_TOKEN }}
          # SHA the triggering Release ran on (empty for manual dispatch).
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # --- iOS-pinned tag (force-keep). Read via IOS_PIN_TOKEN against
          # IOS_PIN_REF; the default token is repo-scoped and can't read the
          # other repo. If unresolved we ABORT all deletions — never risk
          # pruning whatever the app installs.
          PIN="$(GH_TOKEN="${IOS_PIN_TOKEN:-$GH_TOKEN}" gh api "repos/${IOS_REPO}/contents/${IOS_PIN_PATH}?ref=${IOS_PIN_REF}" --jq '.content' 2>/dev/null \
                  | base64 -d 2>/dev/null \
                  | grep -oE 'pinnedReleaseTag[^"]*"v[0-9][^"]*"' \
                  | grep -oE 'v[0-9][^"]*' | head -1 || true)"
          if [ -z "${PIN:-}" ]; then
            echo "::warning::could not resolve iOS pinnedReleaseTag — ABORTING deletions (fail-safe)"
            echo "ABORT=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$PIN" > /tmp/pin
          echo "iOS pin (force-keep): ${PIN}"

          # --- Daemon Channel pins (force-keep, ALL series). Each app
          # generation reads its own version-scoped manifest
          # (ios-channel.json for the 1.5-and-earlier series,
          # ios-channel-<MAJ>-<MIN>.json after — see
          # publish-ios-channel.yml), so EVERY channel file's pin must
          # survive pruning for as long as its file exists. Retiring an
          # app generation = deleting its channel asset; its pin then
          # drops out of force-keep naturally. Same fail-safe posture as
          # the compiled pin: if the channel-ios release exists but ANY
          # manifest pin can't be read, ABORT all deletions. An absent
          # channel-ios release (never published) is fine. The
          # channel-ios release itself is not a `v*` tag and is
          # therefore never a prune candidate.
          CH_PINS=""
          if gh release view channel-ios --json name >/dev/null 2>&1; then
            MANIFESTS="$(gh release view channel-ios --json assets               --jq '.assets[].name' | grep -E '^ios-channel(-[0-9]+-[0-9]+)?\.json$' || true)"
            if [ -z "$MANIFESTS" ]; then
              echo "::warning::channel-ios exists but lists no channel manifests — ABORTING deletions (fail-safe)"
              echo "ABORT=1" >> "$GITHUB_ENV"; exit 0
            fi
            for M in $MANIFESTS; do
              CH_PIN=""
              if gh release download channel-ios -p "$M" -O /tmp/ch.json --clobber 2>/dev/null; then
                CH_PIN="$(jq -r '.pin // empty' /tmp/ch.json || true)"
              fi
              if [ -z "$CH_PIN" ]; then
                echo "::warning::channel manifest $M pin unreadable — ABORTING deletions (fail-safe)"
                echo "ABORT=1" >> "$GITHUB_ENV"; exit 0
              fi
              echo "channel pin (force-keep, $M): ${CH_PIN}"
              CH_PINS="$CH_PINS $CH_PIN"
            done
          fi

          # --- Which channel(s) to prune. Channel-scoped so a release only
          # touches its OWN line — a dev rc never chews into stable history,
          # and a stable release never churns dev.
          #   - manual dispatch: clean BOTH channels.
          #   - post-Release: only the channel the triggering tag belongs to
          #     (clean semver -> stable, -rc/-dev -> dev).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CHANNELS="stable dev"
          else
            TAG="$(git tag --points-at "${TRIGGER_SHA}" 2>/dev/null | grep -E '^v[0-9]' | head -1 || true)"
            if [ -z "$TAG" ]; then
              echo "::warning::no release tag at ${TRIGGER_SHA} — nothing to prune"
              echo "ABORT=1" >> "$GITHUB_ENV"; exit 0
            fi
            case "$TAG" in *-*) CHANNELS="dev";; *) CHANNELS="stable";; esac
            echo "triggering tag: ${TAG}"
          fi
          echo "$CHANNELS" > /tmp/channels
          echo "## Prune plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- channels: ${CHANNELS} · iOS pin: ${PIN} · channel pins: ${CH_PINS:-none}" >> "$GITHUB_STEP_SUMMARY"

          # --- Per-channel keep-list: last N of that channel + the pin iff it
          # belongs to that channel. Written to /tmp/keep-<ch>.txt for the
          # delete steps below (single source of truth).
          for ch in $CHANNELS; do
            if [ "$ch" = "stable" ]; then
              mapfile -t IN < <(git tag -l 'v*' | grep -v '[-]' | sort -rV || true); keepN="${KEEP_STABLE}"
            else
              mapfile -t IN < <(git tag -l 'v*' | grep '[-]' | sort -rV || true); keepN="${KEEP_PRERELEASE}"
            fi
            KEEP=(); n=0
            for t in "${IN[@]}"; do KEEP+=("$t"); n=$((n+1)); [ "$n" -ge "$keepN" ] && break; done
            case "$PIN" in
              *-*) [ "$ch" = "dev" ]    && KEEP+=("$PIN");;
              *)   [ "$ch" = "stable" ] && KEEP+=("$PIN");;
            esac
            # Channel pins are always clean stable tags (the publish
            # workflow enforces vX.Y.Z on main-ancestry).
            # Word-splitting intended: CH_PINS is a space-separated
            # list of vX.Y.Z tags (one per channel manifest).
            # shellcheck disable=SC2206
            if [ -n "$CH_PINS" ] && [ "$ch" = "stable" ]; then KEEP+=($CH_PINS); fi
            printf '%s\n' "${KEEP[@]}" | sort -uV > "/tmp/keep-$ch.txt"
            echo "[$ch] keep: $(paste -sd' ' "/tmp/keep-$ch.txt")"
            echo "- $ch keeps: $(paste -sd' ' "/tmp/keep-$ch.txt")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Prune GitHub Releases + tags (per channel)
        run: |
          set -euo pipefail
          if [ "${ABORT:-0}" = "1" ]; then echo "fail-safe: skipping"; exit 0; fi
          echo "DRY_RUN=${DRY_RUN}"
          for ch in $(cat /tmp/channels); do
            if [ "$ch" = "stable" ]; then
              mapfile -t IN < <(git tag -l 'v*' | grep -v '[-]' | sort -rV || true)
            else
              mapfile -t IN < <(git tag -l 'v*' | grep '[-]' | sort -rV || true)
            fi
            for t in "${IN[@]}"; do
              grep -qxF "$t" "/tmp/keep-$ch.txt" && continue
              if [ "${DRY_RUN}" = "true" ]; then
                echo "[dry-run][$ch] would delete release+tag $t"
              else
                echo "[$ch] deleting release+tag $t"
                # --cleanup-tag removes the tag too, but ONLY when a release
                # exists; a `git push --delete` also clears orphan tags whose
                # release was already gone.
                gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
                git push origin --delete "refs/tags/$t" 2>/dev/null || true
              fi
            done
          done

      - name: Prune gh-pages dnf rpms + reindex (per channel)
        run: |
          set -euo pipefail
          if [ "${ABORT:-0}" = "1" ]; then echo "fail-safe: skipping"; exit 0; fi
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages not seeded — nothing to prune"; exit 0
          fi
          sudo apt-get update && sudo apt-get install -y createrepo-c
          git fetch --no-tags origin gh-pages
          git worktree add --checkout rpmrepo origin/gh-pages
          changed=0
          PRUNED_CH=()
          for ch in $(cat /tmp/channels); do
            # keep-versions = keep-tags as rpm versions (strip 'v', '-' -> '~').
            KV=(); while read -r t; do KV+=("$(printf '%s' "${t#v}" | tr '-' '~')"); done < "/tmp/keep-$ch.txt"
            for f in rpmrepo/rpm/"$ch"/*/*.rpm; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"; keep=0
              for v in "${KV[@]}"; do case "$base" in "mtroamd-${v}-"*) keep=1; break;; esac; done
              if [ "$keep" -eq 0 ]; then
                if [ "${DRY_RUN}" = "true" ]; then echo "[dry-run][$ch] would rm $f"
                else echo "[$ch] rm $f"; rm -f "$f"; changed=1; fi
              fi
            done
            PRUNED_CH+=("$ch")
          done
          if [ "${DRY_RUN}" = "true" ] || [ "$changed" -eq 0 ]; then
            echo "no rpm changes to commit"; exit 0
          fi
          # Reindex only the channels we touched.
          for ch in "${PRUNED_CH[@]}"; do
            for d in rpmrepo/rpm/"$ch"/*/; do [ -d "$d" ] && createrepo_c "$d"; done
          done
          cd rpmrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "prune: drop rpms outside per-channel keep-list" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:gh-pages
