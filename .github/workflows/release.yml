name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build:
    name: Build & sign release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # we want tag history for `git describe`

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build all targets
        run: make dist

      # --- Debian packaging (nfpm) -------------------------------------------
      # Builds one .deb per arch from the binaries above. Kept entirely
      # separate from SHA256SUMS so the iOS verify path is byte-for-byte
      # unchanged; the .deb naming (meshtermd_<ver>_<arch>.deb, underscores)
      # also can't be matched by the `meshtermd-*` checksum glob below.
      - name: Set up nfpm
        run: |
          sudo apt-get install -y gettext-base   # envsubst (nfpm doesn't expand env in contents globs)
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3   # pinned for reproducible/auditable release builds
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # nfpm's semver schema converts a -rc/-dev prerelease tag into a
          # ~ deb version (sorts below the matching stable release).
          export MESHTERMD_VERSION="${TAG#v}"
          # The systemd --user unit is a static render — generate once with the
          # amd64 binary and reuse it for every arch's deb.
          ./dist/meshtermd-linux-amd64 unit print --bin=/usr/bin/meshtermd > dist/meshtermd.service
          for triple in "amd64 amd64" "arm64 arm64" "armv7 armhf"; do
            set -- $triple
            export MESHTERMD_GOARCH="$1" MESHTERMD_DEB_ARCH="$2"
            envsubst < packaging/nfpm/nfpm.yaml > "dist/nfpm.$2.yaml"
            nfpm package -f "dist/nfpm.$2.yaml" -p deb -t dist/
          done
          ls -la dist/*.deb

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # Hash both meshtermd-* (the daemon) and mtctl-* (the laptop
          # CLI). The single signed SHA256SUMS covers everything, so
          # iOS's verify path picks up mtctl integrity for free once
          # it learns the new asset filenames. The .deb files are
          # intentionally NOT included here (see SHA256SUMS-deb).
          sha256sum meshtermd-* mtctl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SHA256SUMS-deb
        working-directory: dist
        run: |
          # Separate checksum file for the Debian packages so `dpkg -i`
          # users can verify, without touching the iOS-trusted SHA256SUMS.
          sha256sum *.deb > SHA256SUMS-deb
          cat SHA256SUMS-deb

      # Optional minisign signing. Only fires if the MINISIGN_KEY
      # repository secret is set. Generate the key locally with
      # `minisign -G -s minisign.key -p minisign.pub`, paste the
      # contents of minisign.key into the secret. The matching
      # public key lives in docs/release-public-key.txt and gets
      # embedded in the iOS app.
      - name: Install minisign
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign SHA256SUMS
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: dist
        run: |
          echo "$MINISIGN_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          # -t writes a trusted comment with the tag for audit trail.
          # The signing process is non-interactive via piping
          # the password.
          echo "$MINISIGN_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -t "meshtermd ${GITHUB_REF_NAME}" \
            -m SHA256SUMS
          # Sign the Debian-package checksums too (separate file → the
          # iOS-trusted SHA256SUMS.minisig is unaffected).
          if [ -f SHA256SUMS-deb ]; then
            echo "$MINISIGN_PASSWORD" | minisign -S \
              -s /tmp/minisign.key \
              -t "meshtermd ${GITHUB_REF_NAME} (deb)" \
              -m SHA256SUMS-deb
          fi
          rm /tmp/minisign.key
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            echo "## meshtermd ${tag}"
            echo
            echo "Server-side daemon and laptop CLI for the meshTerm iOS app."
            echo "See https://github.com/AG-Studio-Apps/meshtermd for the wire spec and security notes."
            echo
            echo "### Binaries"
            echo
            echo "- \`meshtermd-*\` — the daemon. Runs on the host serving Roam sessions."
            echo "- \`mtctl-*\` — the laptop CLI. Attaches to remote daemons over SSH+QUIC."
            echo
            echo "Verify with the published \`SHA256SUMS\` and (if available) its \`.minisig\`."
            echo "The minisign public key is in \`docs/release-public-key.txt\` of this repo."
            echo
            echo "### Compatibility"
            echo
            echo "See README.md compatibility table for the meshTerm iOS app version paired with this release."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # Mark -rc/-dev tags as prereleases so they never become GitHub's
          # "latest" (which iOS self-update queries and which the fetcher
          # refuses) — keeps the dev channel out of the production update path.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/meshtermd-*
            dist/mtctl-*
            dist/*.deb
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/SHA256SUMS-deb
            dist/SHA256SUMS-deb.minisig
            dist/man/meshtermd.8
            dist/man/mtctl.1
            dist/completions/mtctl.bash
            dist/completions/mtctl.zsh
            dist/completions/mtctl.fish
            dist/completions/meshtermd.bash
            dist/completions/meshtermd.zsh
            dist/completions/meshtermd.fish
          fail_on_unmatched_files: false  # minisig + deb sigs are optional

  apt-repo:
    name: Publish to apt repo (gh-pages)
    needs: [release]
    runs-on: ubuntu-latest
    # Gated on the signing-key secret (mirrors the minisign guard). Without it
    # the whole job no-ops, so forks and unconfigured repos stay green.
    env:
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout (full history for branch routing)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts (the .deb files)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish .deb(s) to the routed suite
        if: ${{ env.APT_GPG_KEY != '' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y reprepro

          # --- Route by branch: main-ancestor + clean semver → stable, else dev.
          # main only advances on an App Store release, so 'stable' always
          # matches the live iOS pin. develop / -rc tags land in 'dev'.
          # Fail loudly if we can't resolve main — better than silently
          # misrouting a real release to the wrong suite (set -e aborts here).
          git fetch --no-tags origin main
          SUITE=dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [[ "$TAG" != *-* ]]; then
            SUITE=stable
          fi
          echo "Publishing $TAG → suite '$SUITE'"

          # --- gh-pages must be seeded first (dormant until then; see
          # docs/apt-repo-setup.md). Skip cleanly rather than fail.
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::notice::gh-pages not seeded yet — skipping apt publish (see docs/apt-repo-setup.md)"
            exit 0
          fi

          # --- Import the signing key into an isolated keyring. A
          # passphraseless key (recommended for CI) needs no preset; if a
          # passphrase secret is set, cache it in the agent via loopback so
          # reprepro's gpg calls are non-interactive.
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          printf '%s' "$APT_GPG_KEY" | gpg --batch --import
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
            printf 'preset' | gpg --batch --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" -u "$KEYID" --clearsign -o /dev/null || true
          fi

          # --- Stage the gh-pages worktree, ensure conf/ + .nojekyll, include.
          git worktree add --checkout aptrepo origin/gh-pages
          mkdir -p aptrepo/conf
          cp -n packaging/apt/conf/distributions aptrepo/conf/distributions || true
          touch aptrepo/.nojekyll
          reprepro -b aptrepo includedeb "$SUITE" dist/*.deb

          # --- Commit + push the updated archive.
          cd aptrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: publish ${TAG} to ${SUITE}" || { echo "nothing to publish"; exit 0; }
          git push origin HEAD:gh-pages
