name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build:
    name: Build & sign release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # we want tag history for `git describe`

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build all targets
        run: make dist

      # --- Debian packaging (nfpm) -------------------------------------------
      # Builds one .deb per arch from the binaries above. Kept entirely
      # separate from SHA256SUMS so the iOS verify path is byte-for-byte
      # unchanged; the .deb naming (mtroamd_<ver>_<arch>.deb, underscores)
      # also can't be matched by the `mtroamd-*` checksum glob below.
      - name: Set up nfpm
        run: |
          sudo apt-get install -y gettext-base   # envsubst (nfpm doesn't expand env in contents globs)
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3   # pinned for reproducible/auditable release builds
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # nfpm's semver schema converts a -rc/-dev prerelease tag into a
          # ~ deb version (sorts below the matching stable release).
          export MTROAMD_VERSION="${TAG#v}"
          # The systemd --user unit is a static render — generate once with the
          # amd64 binary and reuse it for every arch's deb.
          ./dist/mtroamd-linux-amd64 unit print --bin=/usr/bin/mtroamd > dist/mtroamd.service
          for triple in "amd64 amd64" "arm64 arm64" "armv7 armhf"; do
            set -- $triple
            export MTROAMD_GOARCH="$1" MTROAMD_PKG_ARCH="$2"
            envsubst < packaging/nfpm/nfpm.yaml > "dist/nfpm.deb.$2.yaml"
            nfpm package -f "dist/nfpm.deb.$2.yaml" -p deb -t dist/
          done
          ls -la dist/*.deb

      - name: Build .rpm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Same nfpm config + binaries as the .deb step; rpm-native arch names
          # + scriptlets (via overrides.rpm in nfpm.yaml). Fedora dropped 32-bit
          # ARM, so x86_64 + aarch64 only.
          export MTROAMD_VERSION="${TAG#v}"
          for pair in "amd64 x86_64" "arm64 aarch64"; do
            set -- $pair
            export MTROAMD_GOARCH="$1" MTROAMD_PKG_ARCH="$2"
            envsubst < packaging/nfpm/nfpm.yaml > "dist/nfpm.rpm.$2.yaml"
            nfpm package -f "dist/nfpm.rpm.$2.yaml" -p rpm -t dist/
          done
          ls -la dist/*.rpm

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # Hash both mtroamd-* (the daemon) and mtroam-* (the laptop
          # CLI). The single signed SHA256SUMS covers everything, so
          # iOS's verify path picks up mtroam integrity for free once
          # it learns the new asset filenames. The .deb files are
          # intentionally NOT included here (see SHA256SUMS-deb).
          sha256sum mtroamd-* mtroam-* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SHA256SUMS-deb
        working-directory: dist
        run: |
          # Separate checksum file for the Debian packages so `dpkg -i`
          # users can verify, without touching the iOS-trusted SHA256SUMS.
          sha256sum *.deb > SHA256SUMS-deb
          cat SHA256SUMS-deb

      # Optional minisign signing. Only fires if the MINISIGN_KEY
      # repository secret is set. Generate the key locally with
      # `minisign -G -s minisign.key -p minisign.pub`, paste the
      # contents of minisign.key into the secret. The matching
      # public key lives in docs/release-public-key.txt and gets
      # embedded in the iOS app.
      - name: Install minisign
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign SHA256SUMS
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: dist
        run: |
          echo "$MINISIGN_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          # -t writes a trusted comment with the tag for audit trail.
          # The signing process is non-interactive via piping
          # the password.
          echo "$MINISIGN_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -t "mtroamd ${GITHUB_REF_NAME}" \
            -m SHA256SUMS
          # Sign the Debian-package checksums too (separate file → the
          # iOS-trusted SHA256SUMS.minisig is unaffected).
          if [ -f SHA256SUMS-deb ]; then
            echo "$MINISIGN_PASSWORD" | minisign -S \
              -s /tmp/minisign.key \
              -t "mtroamd ${GITHUB_REF_NAME} (deb)" \
              -m SHA256SUMS-deb
          fi
          rm /tmp/minisign.key
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            echo "## mtroamd ${tag}"
            echo
            echo "Server-side daemon and laptop CLI for the meshTerm iOS app."
            echo "See https://github.com/AG-Studio-Apps/mtroamd for the wire spec and security notes."
            echo
            echo "### Binaries"
            echo
            echo "- \`mtroamd-*\` — the daemon. Runs on the host serving mtRoam sessions."
            echo "- \`mtroam-*\` — the laptop CLI. Attaches to remote daemons over SSH+QUIC."
            echo
            echo "Verify with the published \`SHA256SUMS\` and (if available) its \`.minisig\`."
            echo "The minisign public key is in \`docs/release-public-key.txt\` of this repo."
            echo
            echo "### Compatibility"
            echo
            echo "See README.md compatibility table for the meshTerm iOS app version paired with this release."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # Mark -rc/-dev tags as prereleases so they never become GitHub's
          # "latest" (which iOS self-update queries and which the fetcher
          # refuses) — keeps the dev channel out of the production update path.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/mtroamd-*
            dist/mtroam-*
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/SHA256SUMS-deb
            dist/SHA256SUMS-deb.minisig
            dist/man/mtroamd.8
            dist/man/mtroam.1
            dist/completions/mtroam.bash
            dist/completions/mtroam.zsh
            dist/completions/mtroam.fish
            dist/completions/mtroamd.bash
            dist/completions/mtroamd.zsh
            dist/completions/mtroamd.fish
          fail_on_unmatched_files: false  # minisig + deb sigs are optional

  apt-repo:
    name: Publish to apt repo (gh-pages)
    needs: [release]
    runs-on: ubuntu-latest
    # Gated on the signing-key secret (mirrors the minisign guard). Without it
    # the whole job no-ops, so forks and unconfigured repos stay green.
    env:
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout (full history for branch routing)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts (the .deb files)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish .deb(s) to the routed suite
        if: ${{ env.APT_GPG_KEY != '' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y reprepro

          # --- Route by branch: main-ancestor + clean semver → stable, else dev.
          # main only advances on an App Store release, so 'stable' always
          # matches the live iOS pin. develop / -rc tags land in 'dev'.
          # Fail loudly if we can't resolve main — better than silently
          # misrouting a real release to the wrong suite (set -e aborts here).
          git fetch --no-tags origin main
          SUITE=dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [[ "$TAG" != *-* ]]; then
            SUITE=stable
          fi
          echo "Publishing $TAG → suite '$SUITE'"

          # --- gh-pages must be seeded first (dormant until then; see
          # docs/apt-repo-setup.md). Skip cleanly rather than fail.
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::notice::gh-pages not seeded yet — skipping apt publish (see docs/apt-repo-setup.md)"
            exit 0
          fi

          # --- Import the signing key into an isolated keyring. A
          # passphraseless key (recommended for CI) needs no preset; if a
          # passphrase secret is set, cache it in the agent via loopback so
          # reprepro's gpg calls are non-interactive.
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          printf '%s' "$APT_GPG_KEY" | gpg --batch --import
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
            printf 'preset' | gpg --batch --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" -u "$KEYID" --clearsign -o /dev/null || true
          fi

          # --- Stage the gh-pages worktree, ensure conf/ + .nojekyll, include.
          git worktree add --checkout aptrepo origin/gh-pages
          mkdir -p aptrepo/conf
          cp -n packaging/apt/conf/distributions aptrepo/conf/distributions || true
          touch aptrepo/.nojekyll

          # --- Prune the pre-rebrand 'meshtermd' package (old name; it carried
          # the old Apache-2.0 License field) from both suites and delete its
          # now-orphaned pool files. Idempotent: a no-op once it's gone.
          for s in stable dev; do
            reprepro -b aptrepo remove "$s" meshtermd 2>/dev/null || true
          done
          reprepro -b aptrepo deleteunreferenced 2>/dev/null || true

          reprepro -b aptrepo includedeb "$SUITE" dist/*.deb

          # --- Commit + push the updated archive.
          cd aptrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: publish ${TAG} to ${SUITE}" || { echo "nothing to publish"; exit 0; }
          git push origin HEAD:gh-pages

  rpm-repo:
    name: Publish to rpm repo (gh-pages)
    # Runs AFTER apt-repo (not in parallel) — both push gh-pages, so serialize
    # to avoid a non-fast-forward race.
    needs: [release, apt-repo]
    runs-on: ubuntu-latest
    env:
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout (full history for branch routing)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts (the .rpm files)
        if: ${{ env.APT_GPG_KEY != '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish .rpm(s) to the routed channel
        if: ${{ env.APT_GPG_KEY != '' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob   # an empty *.rpm / */ glob expands to nothing, not a literal
          sudo apt-get update && sudo apt-get install -y rpm createrepo-c

          # --- Route by branch (same rule as apt): main-ancestor + clean semver
          # → stable, else dev.
          git fetch --no-tags origin main
          SUITE=dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [[ "$TAG" != *-* ]]; then
            SUITE=stable
          fi
          echo "Publishing $TAG → rpm channel '$SUITE'"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::notice::gh-pages not seeded yet — skipping rpm publish"
            exit 0
          fi

          # --- Import the (passphraseless) signing key + point rpmsign at it.
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          printf '%s' "$APT_GPG_KEY" | gpg --batch --import
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          {
            echo "%_gpg_name $KEYID"
            echo "%__gpg $(command -v gpg)"
            echo "%_gpg_sign_cmd_extra_args --pinentry-mode loopback --batch --homedir $GNUPGHOME${APT_GPG_PASSPHRASE:+ --passphrase $APT_GPG_PASSPHRASE}"
          } > "$HOME/.rpmmacros"
          # dnf verifies each package's signature (gpgcheck=1), so sign them all.
          rpmsign --addsign dist/*.rpm

          # --- Stage gh-pages, drop rpms into rpm/<channel>/<basearch>/, reindex.
          git fetch --no-tags origin gh-pages
          git worktree add --checkout rpmrepo origin/gh-pages
          for r in dist/*.rpm; do
            base="$(basename "$r" .rpm)"; arch="${base##*.}"   # x86_64 / aarch64
            dest="rpmrepo/rpm/${SUITE}/${arch}"
            mkdir -p "$dest"
            cp "$r" "$dest/"
          done
          # Prune pre-rebrand 'meshtermd' rpms (old name; License: Apache-2.0)
          # from this channel BEFORE reindex, so they drop out of the
          # regenerated repodata instead of lingering as a stale Apache entry.
          find "rpmrepo/rpm/$SUITE" -type f -name 'meshtermd-*.rpm' -delete 2>/dev/null || true
          for d in rpmrepo/rpm/"$SUITE"/*/; do createrepo_c "$d"; done
          # ASCII-armored key for dnf's gpgkey=, plus keep Jekyll off.
          cp docs/apt-signing-key.asc rpmrepo/mtroamd-archive-keyring.asc
          touch rpmrepo/.nojekyll

          cd rpmrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rpm: publish ${TAG} to ${SUITE}" || { echo "nothing to publish"; exit 0; }
          git push origin HEAD:gh-pages

  apk-repo:
    name: Publish to apk repo (gh-pages)
    # Runs AFTER rpm-repo — all three push gh-pages, so serialize to avoid a
    # non-fast-forward race.
    needs: [release, apt-repo, rpm-repo]
    runs-on: ubuntu-latest
    env:
      ABUILD_KEY: ${{ secrets.ABUILD_KEY }}
    steps:
      - name: Checkout (full history for branch routing)
        if: ${{ env.ABUILD_KEY != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts (the static binaries + man + completions)
        if: ${{ env.ABUILD_KEY != '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Build + sign apks (Alpine), publish to routed suite
        if: ${{ env.ABUILD_KEY != '' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Route by main-ancestry, same as apt/rpm. The smoke test below
          # (install + OpenRC start + restart-survival in a privileged Alpine
          # container) gates every publish; the original real-box dev pin was
          # lifted 2026-06-05 on that basis.
          git fetch --no-tags origin main
          SUITE=dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [[ "$TAG" != *-* ]]; then
            SUITE=stable
          fi
          echo "Publishing $TAG → apk suite '$SUITE'"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::notice::gh-pages not seeded yet — skipping apk publish"
            exit 0
          fi

          printf '%s' "$ABUILD_KEY" > abuild-key.rsa
          mkdir -p apkout

          # abuild is Alpine-only; build + sign all arches in a throwaway
          # container. The build logic lives in packaging/apk/ci-build.sh
          # (runs the abuild loop as an unprivileged user — abuild refuses
          # root). The APKBUILD repackages the prebuilt static dist/ binaries
          # (no compilation), so one amd64 host emits every arch.
          docker run --rm -v "$PWD:/work" -w /work \
            -e MTROAMD_VERSION="${TAG#v}" \
            alpine:latest sh /work/packaging/apk/ci-build.sh
          rm -f abuild-key.rsa

          # --- Gate publish on a smoke test of the freshly-built x86_64 apk:
          # install it, start the OpenRC service, create a session, restart, and
          # assert the pty-sidecar survived + the daemon reattached it. A broken
          # package never reaches the repo.
          apkfile="$(ls apkout/x86_64/mtroamd-*.apk 2>/dev/null | head -1)"
          if [ -n "$apkfile" ]; then
            docker run --rm --privileged -v "$PWD:/work" \
              -e MTROAMD_APK="/work/$apkfile" \
              alpine:latest sh /work/packaging/apk/smoke.sh
          else
            echo "::error::no x86_64 apk built — nothing to smoke-test"; exit 1
          fi

          # --- Stage gh-pages, publish to apk/<suite>/<arch>/ + the pubkey.
          git fetch --no-tags origin gh-pages
          git worktree add --checkout apkrepo origin/gh-pages
          for arch in x86_64 aarch64 armv7; do
            [ -d "apkout/$arch" ] || continue
            dest="apkrepo/apk/${SUITE}/${arch}"
            mkdir -p "$dest"
            cp apkout/"$arch"/*.apk apkout/"$arch"/APKINDEX.tar.gz "$dest/"
          done
          cp apkout/mtroamd-apk.rsa.pub apkrepo/mtroamd-apk.rsa.pub
          touch apkrepo/.nojekyll

          cd apkrepo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apk: publish ${TAG} to ${SUITE}" || { echo "nothing to publish"; exit 0; }
          git push origin HEAD:gh-pages
